<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-labelledby="geometry-title geometry-desc">
  <title id="geometry-title">犬を対象としたX線透過と検出の概念図</title>
  <desc id="geometry-desc">左のX線源から、中央の一様な被写体を通り、右の検出器へX線が進む。被写体の横に犬のシルエットを目印として添える。被写体内の経路長を体厚t、X線源から検出器までをSIDとして示す。寸法は模式的で、犬の解剖構造、実際の配置や光子数を表していない。</desc>
  <defs>
    <marker id="beam-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#087E8B"/>
    </marker>
    <marker id="dimension-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 7 1 L 1 4 L 7 7" fill="none" stroke="#526878" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1000" height="230" rx="14" fill="#F6F8FA"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif" fill="#182D41">
    <g font-size="20" font-weight="600" text-anchor="middle">
      <text x="100" y="35">X線源</text>
      <text x="535" y="35">被写体（一様モデル）</text>
      <text x="888" y="35">検出器</text>
    </g>

    <!-- 犬は被写体の対象を示す目印。内部構造や撮影姿勢は表さない。 -->
    <g transform="translate(355 10) scale(.63)" fill="#526878">
      <!-- 立ち耳・豊かな胸毛・背中に巻く尾を持つポメラニアンの小さな目印。 -->
      <path d="M 62 30 C 64 24 57 19 63 11 C 68 3 80 4 85 12 C 91 20 84 28 77 28 C 73 28 70 25 72 22 C 74 18 81 22 81 17 C 81 12 75 10 70 14 C 65 18 69 23 70 28 Z"/>
      <path d="M 29 27 L 44 23 L 58 25 L 70 31 L 73 38 L 69 43 L 64 46 L 59 45 L 57 38 L 45 39 L 39 37 L 36 45 L 29 46 L 25 42 L 27 35 Z"/>
      <path d="M 6 18 L 7 9 L 10 2 L 17 8 L 26 3 L 30 12 L 31 18 L 37 23 L 33 28 L 36 34 L 30 35 L 28 41 L 22 38 L 18 43 L 14 38 L 8 39 L 9 33 L 3 30 L 6 24 L 3 20 Z"/>
      <path d="M 11 26 Q 18 30 26 25 L 23 31 L 18 34 L 13 31 Z" fill="#F6F8FA"/>
    </g>

    <rect x="440" y="58" width="180" height="86" rx="5" fill="#DCEFF0" stroke="#087E8B" stroke-width="1.5"/>
    <text x="530" y="85" text-anchor="middle" font-size="17">透過</text>

    <circle cx="100" cy="101" r="26" fill="#FFFFFF" stroke="#182D41" stroke-width="2"/>
    <path d="M 91 92 L 109 110 M 109 92 L 91 110" fill="none" stroke="#182D41" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="880" y="58" width="16" height="86" rx="3" fill="#182D41"/>

    <!-- 矢印は進行方向のみを示し、長さや本数に線量の意味はない。 -->
    <path d="M 139 101 H 426 M 450 101 H 608 M 634 101 H 870" fill="none" stroke="#087E8B" stroke-width="2.5" marker-end="url(#beam-arrow)"/>
    <text x="280" y="84" text-anchor="middle" font-size="16" fill="#526878">X線の進む向き</text>
    <text x="836" y="127" text-anchor="middle" font-size="17">検出</text>

    <g fill="none" stroke="#9AAAB5" stroke-width="1">
      <path d="M 440 145 V 166 M 620 145 V 166 M 100 133 V 200 M 880 150 V 200"/>
    </g>
    <g fill="none" stroke="#526878" stroke-width="1.3" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)">
      <path d="M 443 157 H 617"/>
      <path d="M 103 191 H 877"/>
    </g>
    <text x="530" y="179" text-anchor="middle" font-size="16">体厚 t（経路長）</text>
    <text x="490" y="217" text-anchor="middle" font-size="17">SID（X線源から検出器までの距離）</text>
  </g>
</svg>
